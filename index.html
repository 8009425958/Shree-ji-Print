<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ji Print Production System</title>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; padding: 15px; }
        .container { max-width: 750px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { flex: 1; padding: 10px; text-align: center; background: #eee; cursor: pointer; font-weight: bold; border: none; outline: none; }
        .tab-btn.active { background: #007bff; color: white; border-radius: 5px 5px 0 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button.btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button.btn-submit:hover { background: #218838; }
        .hidden { display: none; }
        .logout-btn { background: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; float: right; margin-bottom: 15px; }
        
        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
        th { background-color: #007bff; color: white; }
        tfoot tr { background-color: #e9ecef; font-weight: bold; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
        .summary-header { background-color: #28a745 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Shree Ji Print Production</h2>

    <!-- LOGIN SCREEN -->
    <div id="loginSection">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('operatorTab')">Operator Login</button>
            <button class="tab-btn" onclick="switchTab('adminTab')">Admin Login</button>
        </div>

        <!-- Operator Login Form -->
        <div id="operatorTab">
            <div class="form-group">
                <label>Machine Name / ID</label>
                <input type="text" id="opMachineId" placeholder="e.g. MS1">
            </div>
            <button class="btn-submit" onclick="loginOperator()">Login as Operator</button>
        </div>

        <!-- Admin Login Form -->
        <div id="adminTab" class="hidden">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="adminUser" placeholder="Enter Admin Email">
            </div>
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="adminPass" placeholder="Enter Admin Password">
            </div>
            <button class="btn-submit" style="background:#007bff;" onclick="loginAdmin()">Login as Admin</button>
        </div>
    </div>

    <!-- OPERATOR DASHBOARD -->
    <div id="operatorDashboard" class="hidden">
        <button class="logout-btn" onclick="logout()">Logout</button>
        <h3>Production Entry (<span id="displayMachine"></span>)</h3>
        <hr style="margin: 10px 0;">
        
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="prodDate">
        </div>
        <div class="form-group">
            <label>Shift</label>
            <select id="prodShift">
                <option>Day Shift</option>
                <option>Night Shift</option>
            </select>
        </div>
        <div class="form-group">
            <label>Design / Job Name</label>
            <input type="text" id="jobName" placeholder="Enter Design Name">
        </div>
        <div class="form-group">
            <label>Total Meters Printed</label>
            <input type="number" step="any" id="prodMeters" placeholder="e.g. 1200">
        </div>
        <div class="form-group">
            <label>Ink Used (Liters)</label>
            <input type="number" step="any" id="inkCost" placeholder="e.g. 1, 2.5, 6.2">
        </div>
        <button class="btn-submit" onclick="submitProduction()">Submit Report</button>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="hidden">
        <button class="logout-btn" onclick="logout()">Logout</button>
        <h3>Detailed Production Report</h3>
        <hr style="margin: 10px 0;">

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Machine</th>
                    <th>Shift</th>
                    <th>Job Name</th>
                    <th>Meters</th>
                    <th>Ink Used</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <!-- Detailed Data -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4" style="text-align: right;"><strong>Total:</strong></td>
                    <td id="totalMetersCell"><strong>0 m</strong></td>
                    <td id="totalInkCell"><strong>0 Ltr</strong></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>

        <br>
        <h3>Machine-wise Summary (Day / Night Jod)</h3>
        <table>
            <thead>
                <tr>
                    <th class="summary-header">Machine</th>
                    <th class="summary-header">Day Shift (m)</th>
                    <th class="summary-header">Night Shift (m)</th>
                    <th class="summary-header">Total Meters</th>
                    <th class="summary-header">Total Ink (Ltr)</th>
                </tr>
            </thead>
            <tbody id="summaryTableBody">
                <!-- Summary Data -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAmhQqduxbS6-i6d62W97rTEVp9volypLg",
        authDomain: "shree-ji-print-production.firebaseapp.com",
        databaseURL: "https://shree-ji-print-production-default-rtdb.firebaseio.com",
        projectId: "shree-ji-print-production",
        storageBucket: "shree-ji-print-production.firebasestorage.app",
        messagingSenderId: "363365039117",
        appId: "1:363365039117:web:d6745f223786f6fad2e944",
        measurementId: "G-SNEC9TN8EL"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const database = firebase.database();

    document.getElementById('prodDate').valueAsDate = new Date();

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(tabName === 'operatorTab') {
            event.target.classList.add('active');
            document.getElementById('operatorTab').classList.remove('hidden');
            document.getElementById('adminTab').classList.add('hidden');
        } else {
            event.target.classList.add('active');
            document.getElementById('adminTab').classList.remove('hidden');
            document.getElementById('operatorTab').classList.add('hidden');
        }
    }

    function loginOperator() {
        const mId = document.getElementById('opMachineId').value.trim();
        if (!mId) {
            alert("Kripya Machine ID enter karein!");
            return;
        }

        auth.signInAnonymously()
            .then(() => {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('operatorDashboard').classList.remove('hidden');
                document.getElementById('displayMachine').innerText = mId;
            })
            .catch((error) => {
                alert("Operator Login Fail: " + error.message);
            });
    }

    function loginAdmin() {
        const email = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;

        auth.signInWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                listenForAdminReports();
            })
            .catch((error) => {
                alert("Admin Login Fail: " + error.message);
            });
    }

    function submitProduction() {
        const mId = document.getElementById('displayMachine').innerText;
        const date = document.getElementById('prodDate').value;
        const shift = document.getElementById('prodShift').value;
        const job = document.getElementById('jobName').value;
        const meters = document.getElementById('prodMeters').value;
        const ink = document.getElementById('inkCost').value;

        if (!job || !meters) {
            alert("Kripya Design Name aur Meters bharein!");
            return;
        }

        const newReportRef = database.ref('production_reports').push();
        newReportRef.set({
            mId: mId,
            date: date,
            shift: shift,
            job: job,
            meters: parseFloat(meters) || 0,
            ink: parseFloat(ink) || 0
        }, function(error) {
            if (error) {
                alert("Data save karne me error: " + error.message);
            } else {
                alert("Production Report Submit ho gayi!");
                document.getElementById('jobName').value = "";
                document.getElementById('prodMeters').value = "";
                document.getElementById('inkCost').value = "";
            }
        });
    }

    function listenForAdminReports() {
        const reportsRef = database.ref('production_reports');
        reportsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('reportTableBody');
            const summaryBody = document.getElementById('summaryTableBody');
            const totalCell = document.getElementById('totalMetersCell');
            const totalInkCell = document.getElementById('totalInkCell');
            
            tbody.innerHTML = "";
            summaryBody.innerHTML = "";
            
            let grandTotalMeters = 0;
            let grandTotalInk = 0;
            let machineSummary = {};

            if(!data) {
                tbody.innerHTML = "<tr><td colspan='7'>No reports available</td></tr>";
                summaryBody.innerHTML = "<tr><td colspan='5'>No summary available</td></tr>";
                totalCell.innerHTML = "<strong>0 m</strong>";
                totalInkCell.innerHTML = "<strong>0 Ltr</strong>";
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const r = data[key];
                const metersVal = parseFloat(r.meters) || 0;
                const inkVal = parseFloat(r.ink) || 0;
                const mName = r.mId || "Unknown";

                grandTotalMeters += metersVal;
                grandTotalInk += inkVal;

                // Machine summary calculation
                if (!machineSummary[mName]) {
                    machineSummary[mName] = { day: 0, night: 0, ink: 0 };
                }
                if (r.shift === "Day Shift") {
                    machineSummary[mName].day += metersVal;
                } else if (r.shift === "Night Shift") {
                    machineSummary[mName].night += metersVal;
                }
                machineSummary[mName].ink += inkVal;

                // Detailed Row
                const row = `<tr>
                    <td>${r.date}</td>
                    <td>${r.mId}</td>
                    <td>${r.shift}</td>
                    <td>${r.job}</td>
                    <td><b>${metersVal} m</b></td>
                    <td>${inkVal > 0 ? inkVal + ' Ltr' : '-'}</td>
                    <td><button class="delete-btn" onclick="deleteEntry('${key}')">X</button></td>
                </tr>`;
                tbody.innerHTML += row;
            });

            // Set Main Totals
            totalCell.innerHTML = `<strong>${grandTotalMeters.toFixed(1)} m</strong>`;
            totalInkCell.innerHTML = `<strong>${grandTotalInk.toFixed(1)} Ltr</strong>`;

            // Build Machine Summary Table
            Object.keys(machineSummary).forEach(mName => {
                const s = machineSummary[mName];
                const totalM = s.day + s.night;
                const sRow = `<tr>
                    <td><b>${mName}</b></td>
                    <td>${s.day.toFixed(1)} m</td>
                    <td>${s.night.toFixed(1)} m</td>
                    <td><b>${totalM.toFixed(1)} m</b></td>
                    <td><b>${s.ink.toFixed(1)} Ltr</b></td>
                </tr>`;
                summaryBody.innerHTML += sRow;
            });
        });
    }

    function deleteEntry(key) {
        if(confirm("Kya aap is entry ko delete karna chahte hain?")) {
            database.ref('production_reports/' + key).remove();
        }
    }

    function logout() {
        auth.signOut().then(() => {
            document.getElementById('operatorDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        });
    }
</script>

</body>
</html>
